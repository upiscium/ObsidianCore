name: Validate ObsidianCore

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build offline style review fixture
        run: node 98-System/99-dev/tools/build-styles.mjs --preview "$RUNNER_TEMP/obsidian-core-style-preview"

      - name: Check committed CSS and single activation
        run: node 98-System/99-dev/tools/build-styles.mjs --check

      - name: Validate repository
        run: node 98-System/99-dev/validate-repo.mjs

      - name: Inventory system references and guard public interfaces
        run: node 98-System/99-dev/tools/system-reference-audit.mjs --check-interfaces

      - name: Test pure utilities
        run: node --test 98-System/99-dev/test/*.test.mjs

      - name: Upload offline style review fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-core-style-preview
          path: ${{ runner.temp }}/obsidian-core-style-preview/
          if-no-files-found: error
          retention-days: 7
