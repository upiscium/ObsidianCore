name: Validate ObsidianCore

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate repository
        run: node 98-System/99-dev/validate-repo.mjs

      - name: Test pure utilities
        run: node --test 98-System/99-dev/test/*.test.mjs
